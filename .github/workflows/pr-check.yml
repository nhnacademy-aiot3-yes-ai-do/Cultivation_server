name: pr-check

on:
  pull_request:
    branches: [ develop, main ]

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: PACKAGES_READ_TOKEN
      - name: dependency:tree 출력 (충돌 확인용)
        env:
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: mvn -B dependency:tree

  build-test:
    uses: ./.github/workflows/_reusable-test.yml
    secrets: inherit

  docker-build-test:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker 이미지 빌드 테스트 (push는 안 함)
        run: docker build -t user-server:pr-test .