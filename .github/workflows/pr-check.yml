name: pr-check

on:
  pull_request:
    branches: [ develop, main ]

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: PACKAGES_READ_TOKEN
      - name: dependency:tree 출력 (충돌 확인용)
        env:
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: mvn -B dependency:tree

  build-test:
    uses: ./.github/workflows/_reusable-test.yml
    secrets: inherit

  docker-build-test:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Maven settings.xml 생성 (빌드 시크릿용)
        run: |
          cat > settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.PACKAGES_READ_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker 이미지 빌드 테스트 (push는 안 함)
        run: |
          docker buildx build \
            --secret id=maven_settings,src=settings.xml \
            -t user-server:pr-test \
            --load \
            .