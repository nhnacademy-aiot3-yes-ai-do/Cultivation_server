name: Setup test env
description: CI 테스트용 DB/JWT 환경변수 설정
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        echo "DB_HOST=localhost" >> "$GITHUB_ENV"
        echo "DB_PORT=5432" >> "$GITHUB_ENV"
        echo "DB_NAME=testdb" >> "$GITHUB_ENV"
        echo "DB_USERNAME=test" >> "$GITHUB_ENV"
        echo "DB_PASSWORD=test1234" >> "$GITHUB_ENV"
        echo "CULTIVATION_DB_SCHEMA=public" >> "$GITHUB_ENV"
        echo "MINIO_URL=http://localhost:9000" >> "$GITHUB_ENV"
        echo "MINIO_ACCESS_KEY=minioadmin" >> "$GITHUB_ENV"
        echo "MINIO_SECRET_KEY=minioadmin123" >> "$GITHUB_ENV"
        echo "MINIO_BUCKET=testbucket" >> "$GITHUB_ENV"
        echo "RABBITMQ_HOST=localhost" >> "$GITHUB_ENV"
        echo "RABBITMQ_PORT=5672" >> "$GITHUB_ENV"
        echo "RABBITMQ_USERNAME=test" >> "$GITHUB_ENV"
        echo "RABBITMQ_PASSWORD=test1234" >> "$GITHUB_ENV"