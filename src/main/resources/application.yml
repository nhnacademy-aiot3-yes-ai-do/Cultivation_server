spring:
  application:
    name: cultivation-server

  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${CULTIVATION_DB_SCHEMA}&stringtype=unspecified
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    type: org.apache.commons.dbcp2.BasicDataSource
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: ${CULTIVATION_DB_SCHEMA}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    # Enable only while upgrading databases that already recorded V1 before V0.1 was introduced.
    out-of-order: ${FLYWAY_OUT_OF_ORDER:false}
    schemas: ${CULTIVATION_DB_SCHEMA}
    default-schema: ${CULTIVATION_DB_SCHEMA}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

  rabbitmq:
    host: ${RABBITMQ_HOST}      # 로컬 Docker
    port: ${RABBITMQ_PORT}           # AMQP 포트
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

    publisher-confirm-type: correlated
    publisher-returns: true

    template:
      mandatory: true
      retry:
        enabled: true
        max-retries: 3
        initial-interval: 1s
        multiplier: 2.0
        max-interval: 10s

logging:
  level:
    root: ${LOG_LEVEL:INFO}

minio:
  url: ${MINIO_URL}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}
  public-base-url: ${MINIO_PUBLIC_BASE_URL}

influx:
  url: ${INFLUX_URL}
  org: ${INFLUX_ORG}
  bucket: ${INFLUX_BUCKET:sensor-data}
  token: ${INFLUX_TOKEN}
  cloudflare:
    access-client-id: ${CF_ACCESS_CLIENT_ID:}
    access-client-secret: ${CF_ACCESS_CLIENT_SECRET:}

feign:
  client:
    user-server:
      url: ${USER_SERVER_URL}
    ai-server:
      url: ${AI_SERVER_URL}

sensor-cache:
  history-hours: ${SENSOR_CACHE_HISTORY_HOURS:12}
  poll-interval-ms: ${SENSOR_CACHE_POLL_INTERVAL_MS:2000}
  freshness-seconds: ${SENSOR_CACHE_FRESHNESS_SECONDS:3}
  ttl-grace-seconds: ${SENSOR_CACHE_TTL_GRACE_SECONDS:3}
  query-overlap-seconds: ${SENSOR_CACHE_QUERY_OVERLAP_SECONDS:60}
  poll-initial-delay-ms: ${SENSOR_CACHE_POLL_INITIAL_DELAY_MS:10000}
  lock-lease-seconds: ${SENSOR_CACHE_LOCK_LEASE_SECONDS:600}
  reconciliation-interval-seconds: ${SENSOR_CACHE_RECONCILIATION_INTERVAL_SECONDS:300}
